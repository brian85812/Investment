name: Update Moat Dashboard (Daily & On-Demand)

on:
  schedule:
    # 美股正常收盤後 +7/+17/+25 分鐘；紐約時區自動處理夏令／冬令。
    # 台北時間：夏令次日 04:07/04:17/04:25；冬令次日 05:07/05:17/05:25。
    - cron: '7,17,25 16 * * 1-5'
      timezone: 'America/New_York'
    # 涵蓋 13:00 ET 提前收盤：+17 分鐘補抓。正常交易日仍只讀已完成日線。
    - cron: '17 13 * * 1-5'
      timezone: 'America/New_York'
    # 台股 13:30 收盤後 +7/+17/+25 分鐘，保留建置／部署緩衝。
    - cron: '37,47,55 13 * * 1-5'
      timezone: 'Asia/Taipei'
    # 每月 1 日 00:00 UTC 自動續命排程 (防範 GitHub Actions 60 天無 commit 自動停用排程)
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
  workflow_dispatch: # 支援在 GitHub 網頁或手機 App 上手動一鍵點擊執行

# 設定 GitHub Pages 部署權限與 workflow 續命權限
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 啟用並續命 GitHub Actions 排程 (防範 60 天無 commit 休眠)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Update Moat Dashboard (Daily & On-Demand)" --repo "${{ github.repository }}" || true
          gh workflow enable "Monthly Regime Health Check" --repo "${{ github.repository }}" || true
          echo "Keepalive executed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  build:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v7

      - name: 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行離線 Python 回歸測試
        run: python -B -m unittest discover -s tests -p "test_*.py"

      - name: 設定 Node 測試環境
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 執行離線前端事件與策略階段測試
        run: |
          node tests/test_event_ui.js
          node tests/test_strategy_state_ui.js

      - name: 執行量化運算並產出靜態網站構件 (F03 雙市場完整性門檻 + F11 部署前不提前推播)
        env:
          FUTU_API_KEY: ${{ secrets.FUTU_API_KEY }}
          FUTU_PRIVATE_KEY_PEM: ${{ secrets.FUTU_PRIVATE_KEY_PEM }}
          FUTU_PRIVATE_KEY_PASSWORD: ${{ secrets.FUTU_PRIVATE_KEY_PASSWORD }}
        run: |
          python build_static.py --build-only

      - name: 設定 GitHub Pages 構件
        uses: actions/configure-pages@v6

      - name: 上傳靜態檔案構件
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: 上傳推播資料構件 (供 deploy Job 部署成功後讀取)
        uses: actions/upload-artifact@v7
        with:
          name: notify-payload
          path: |
            dist/api_data.json
            dist/api_rollover.json
          retention-days: 1
          if-no-files-found: error

      - name: 建置或測試失敗時發送 Telegram 故障警報 (6b)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -f regime_health_check.py ]; then
            python3 regime_health_check.py --notify-ci-failure
          fi

  deploy:
    needs: build
    if: github.event.schedule != '0 0 1 * *'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼 (供部署後推播與故障警報腳本使用)
        uses: actions/checkout@v7

      - name: 部署至 GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: GitHub Pages 偶發延遲／5xx 等待 (15秒後第1次重試)
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: 重新部署至 GitHub Pages (第1次重試)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: GitHub Pages 持續異常等待 (45秒後第2次重試)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45

      - name: 重新部署至 GitHub Pages (第2次重試)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: 下載推播資料構件
        if: success()
        uses: actions/download-artifact@v8
        with:
          name: notify-payload
          path: './dist'

      - name: 還原前次已送達之推播事件去重狀態 (S03 跨 Run 去重狀態持久化)
        if: success()
        uses: actions/cache/restore@v6
        with:
          path: dist/.last_notified_event.json
          key: tg-notify-dedup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tg-notify-dedup-

      - name: 部署成功後發送 Telegram 戰情推播 (F11/F17 部署後推播 + 重試狀態檢查)
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 build_static.py --notify-only

      - name: 保存已送達之推播事件去重狀態 (S03 跨 Run 去重狀態持久化)
        if: success()
        uses: actions/cache/save@v6
        with:
          path: dist/.last_notified_event.json
          key: tg-notify-dedup-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 部署或推播失敗時發送 Telegram 故障警報 (6b)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -f regime_health_check.py ]; then
            python3 regime_health_check.py --notify-ci-failure
          fi
