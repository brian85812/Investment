name: Update Moat Dashboard (Daily & On-Demand)

on:
  schedule:
    # 美股正常收盤後 +7/+17/+25 分鐘；紐約時區自動處理夏令／冬令。
    # 台北時間：夏令次日 04:07/04:17/04:25；冬令次日 05:07/05:17/05:25。
    - cron: '7,17,25 16 * * 1-5'
      timezone: 'America/New_York'
    # 涵蓋 13:00 ET 提前收盤：+17 分鐘補抓。正常交易日仍只讀已完成日線。
    - cron: '17 13 * * 1-5'
      timezone: 'America/New_York'
    # 台股 13:30 收盤後 +7/+17/+25 分鐘，保留建置／部署緩衝。
    - cron: '37,47,55 13 * * 1-5'
      timezone: 'Asia/Taipei'
    # 每月 1 日 00:00 UTC 自動續命排程 (防範 GitHub Actions 60 天無 commit 自動停用排程)
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
  workflow_dispatch: # 支援在 GitHub 網頁或手機 App 上手動一鍵點擊執行

# 設定 GitHub Pages 部署權限與 workflow 續命權限
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 啟用並續命 GitHub Actions 排程 (防範 60 天無 commit 休眠)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Update Moat Dashboard (Daily & On-Demand)" --repo "${{ github.repository }}" || true
          gh workflow enable "Monthly Regime Health Check" --repo "${{ github.repository }}" || true
          echo "Keepalive executed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  build-and-deploy:
    if: github.event.schedule != '0 0 1 * *'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行離線 Python 回歸測試
        run: python -B -m unittest discover -s tests -p "test_*.py"

      - name: 設定 Node 測試環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 執行離線前端事件與策略階段測試
        run: |
          node tests/test_event_ui.js
          node tests/test_strategy_state_ui.js

      - name: 還原前次已送達之推播事件去重狀態 (S03 跨 Run 去重狀態持久化)
        uses: actions/cache/restore@v4
        with:
          path: dist/.last_notified_event.json
          key: tg-notify-dedup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tg-notify-dedup-

      - name: 執行量化運算並產出靜態網站構件 (F03 雙市場完整性門檻 + F11 部署前不提前推播)
        env:
          FUTU_API_KEY: ${{ secrets.FUTU_API_KEY }}
          FUTU_PRIVATE_KEY_PEM: ${{ secrets.FUTU_PRIVATE_KEY_PEM }}
          FUTU_PRIVATE_KEY_PASSWORD: ${{ secrets.FUTU_PRIVATE_KEY_PASSWORD }}
        run: |
          python build_static.py --build-only

      - name: 設定 GitHub Pages 構件
        uses: actions/configure-pages@v6

      - name: 上傳靜態檔案構件
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: 等待 GitHub Pages 構件索引完成 (防範偶發 eventual-consistency 404)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${COUNT:-0}" -ge 1 ]; then
              echo "github-pages artifact indexed (attempt $i, total_count=$COUNT)"
              exit 0
            fi
            echo "Waiting for github-pages artifact index (attempt $i/12)..."
            sleep 3
          done
          echo "Warning: artifact index check timed out after 36s, proceeding to deploy-pages"

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 部署成功後發送 Telegram 戰情推播 (F11/F17 部署後推播 + 重試狀態檢查)
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python build_static.py --notify-only

      - name: 保存已送達之推播事件去重狀態 (S03 跨 Run 去重狀態持久化)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: dist/.last_notified_event.json
          key: tg-notify-dedup-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 建置或測試失敗時發送 Telegram 故障警報 (6b)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -f regime_health_check.py ]; then
            python3 regime_health_check.py --notify-ci-failure
          fi
