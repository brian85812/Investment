name: Update Moat Dashboard (Daily & On-Demand)

on:
  schedule:
    # 每天台股收盤後 (UTC 06:00 = 台北時間 14:00)
    - cron: '0 6 * * 1-5'
    # 每天美股收盤後 (UTC 21:00 = 台北時間 05:00)
    - cron: '0 21 * * 1-5'
  push:
    branches:
      - main
  workflow_dispatch: # 支援在 GitHub 網頁或手機 App 上手動一鍵點擊執行

# 設定 GitHub Pages 部署權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化運算並產出靜態網站
        run: |
          python build_static.py

      - name: 設定 GitHub Pages 構件
        uses: actions/configure-pages@v5

      - name: 上傳靜態檔案構件
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
